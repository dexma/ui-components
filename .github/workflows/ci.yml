name: CI

on:
    push:
        branches:
            - master
            - feature/upgrade-node-version
    pull_request:
        branches:
            - master

env:
    GH_TOKEN: ${{ secrets.GH_TOKEN }}
    NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            actions: write
            contents: write
            deployments: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies 🛠️
              run: npm install

            - name: Run tests 📝
              run: npm run test

            - name: Build project ⚙️
              run: npm run build

            - name: Publish to NPM 📦
              run: npx semantic-release
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
